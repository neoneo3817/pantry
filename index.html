<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라니의 살림살이</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#ece9e4;--bg2:#f3f1ed;--ink:#2e2620;--mut:#8a8278;--y:#fdb827;--br:#6f4437;--pk:#f4d4cc;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(900px 600px at 50% 38%,#f8f5f0,var(--bg) 70%);font-family:"Plus Jakarta Sans","Noto Sans KR",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 0;pointer-events:none;text-align:center}
.top small{color:var(--mut);font-size:14px;font-weight:500}
.top h1{margin:2px 0 0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.qt{pointer-events:auto;margin:12px auto 0;display:block;max-width:100%;background:var(--y);color:#3d2a14;border:0;border-radius:20px;padding:10px 16px;font-size:14px;font-weight:600;text-align:center;line-height:1.4}
.tg{position:fixed;transform:translate(-50%,-100%);pointer-events:none}
.tg b{display:grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--y);color:#3d2a14;font-size:13px;font-weight:800;box-shadow:0 4px 10px rgba(80,60,30,.25)}
#tray{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 106px);display:flex;gap:12px;justify-content:center;overflow-x:auto;padding:6px 16px}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.chip .ci{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(80,60,30,.12)}
.chip .ci svg{width:38px;height:38px}
.dd{background:var(--y);color:#3d2a14;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}
.dd.x{background:#e9a89b;color:#5a2a20}
#nav{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(520px,calc(100% - 24px));background:#fff;border-radius:32px;padding:12px 10px 10px;display:grid;grid-template-columns:repeat(3,2fr) 70px repeat(2,3fr);align-items:end;box-shadow:0 10px 30px rgba(80,60,30,.14)}
.nb{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:11px;font-weight:600;position:relative}
.nb svg{width:24px;height:24px}
.bd{position:absolute;top:-6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--y);color:#3d2a14;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.plus{width:58px;height:58px;border-radius:50%;border:0;background:var(--y);color:#3d2a14;font-size:32px;font-weight:300;margin-top:-30px;box-shadow:0 10px 24px rgba(253,184,39,.5);justify-self:center;line-height:1}
#ov{position:fixed;inset:0;background:rgba(46,38,32,.4);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#ov[hidden]{display:none}
.sheet{width:min(600px,100%);max-height:90vh;overflow-y:auto;background:var(--bg2);border-radius:32px 32px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 22px)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh h2{margin:0;font-size:24px;font-weight:800}
.cl{width:42px;height:42px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center}
.segs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.seg{border:0;background:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--mut);flex:none}
.seg[aria-pressed=true]{background:var(--y);color:#3d2a14}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.tile{position:relative;background:#fff;border:0;border-radius:24px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.tile .ic{width:68px;height:68px;border-radius:22px;background:var(--p);display:grid;place-items:center}
.tile .ic svg{width:50px;height:50px}
.tile .nm{font-size:13px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qy{position:absolute;top:8px;right:8px;min-width:26px;height:26px;border-radius:13px;background:var(--y);color:#3d2a14;font-size:13px;font-weight:800;display:grid;place-items:center;padding:0 7px}
.qy.z{background:#e9a89b;color:#5a2a20}
.tile .dd{position:absolute;top:8px;left:8px;background:var(--pk);color:var(--br)}
.tile .dd.x{background:#e9a89b;color:#5a2a20}
.cta{width:100%;margin-top:16px;border:0;border-radius:999px;background:var(--y);color:#3d2a14;font-size:16px;font-weight:800;padding:16px}
.emp{display:grid;place-items:center;padding:30px}.emp svg{width:84px;height:84px}
.big{text-align:center;font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.cap-t{text-align:center;color:var(--mut);font-size:14px;margin-bottom:14px}
.wh{background:#fff;border-radius:28px;padding:18px 12px}
.caps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cap{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--mut)}
.trk{width:100%;max-width:60px;height:200px;border-radius:30px;background:#f1efeb;display:flex;align-items:flex-end}
.trk i{display:flex;align-items:flex-end;justify-content:center;width:100%;border-radius:30px;padding-bottom:12px;font-style:normal;font-size:12px;font-weight:700}
.pers{display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:12px 16px;margin-top:12px;font-weight:800;font-size:17px}
.pers svg{width:40px;height:40px}
.rowt{display:flex;gap:10px;margin-top:12px}.rowt .tile{flex:1}
dialog{border:0;border-radius:28px;padding:22px;width:min(400px,92vw);background:var(--bg2);color:var(--ink);font-family:inherit;box-shadow:0 20px 60px rgba(46,38,32,.3)}
dialog::backdrop{background:rgba(46,38,32,.4)}
dialog label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 6px}
dialog input,dialog select{width:100%;border:0;border-radius:16px;background:#fff;padding:13px 14px;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink)}
.step{display:flex;justify-content:center;align-items:center;gap:22px;margin:4px 0 8px;font-size:38px;font-weight:800}
.step button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:22px;font-weight:600}
.drow{display:flex;justify-content:space-between;margin-top:14px}
.tbtn{background:none;border:0;font-size:14px;font-weight:700;color:var(--mut);padding:8px 4px}
.gh{margin:18px 4px 8px;font-size:15px;font-weight:800;color:var(--mut)}
#libBtn{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:48px;height:48px;padding:0;border:0;border-radius:50%;background:none;filter:drop-shadow(0 4px 8px rgba(80,60,30,.22))}
#libBtn svg{width:100%;height:100%;display:block}
#libBtn:active{transform:scale(.94)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top"><small id="dateTx"></small><h1>라니의 살림살이</h1><button class="qt" id="qt" aria-label="다른 문구 보기"></button></div>
<button id="libBtn" aria-label="아이콘 도감 열기"></button>
<div class="tg" id="tgF"></div><div class="tg" id="tgP"></div><div class="tg" id="tgS"></div>
<div id="tray"></div>
<nav id="nav">
<button class="nb" data-nav="fridge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M6 10h12M9 6v2M9 13v3"/></svg>냉장고<b class="bd" id="bF"></b></button>
<button class="nb" data-nav="pantry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M12 3v18M4 13h16M10 8v1M14 8v1"/></svg>식료품<b class="bd" id="bP"></b></button>
<button class="nb" data-nav="supply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5h4.5M12.5 3.5V7"/><path d="M7 12a3 3 0 0 1 3-3h5a3 3 0 0 1 3 3v6.5a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/><path d="M7 14.5h11"/></svg>생필품<b class="bd" id="bS"></b></button>
<button class="plus" id="addBtn" aria-label="물건 추가">+</button>
<button class="nb" data-nav="buy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2 11h10l2-8H7"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>장보기<b class="bd" id="bB"></b></button>
<button class="nb" data-nav="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>통계</button>
</nav>
<div id="ov" hidden></div>

<dialog id="dlg">
  <div class="step"><button id="sDec" type="button" aria-label="하나 줄이기">−</button><span id="sQty">1</span><button id="sInc" type="button" aria-label="하나 늘리기">+</button></div>
  <label for="fName">이름</label><input id="fName" maxlength="20">
  <label for="fCat">칸</label><select id="fCat"></select>
  <label for="fShape">모양</label><select id="fShape"></select>
  <label for="fMin">구매 기준 수량</label><input id="fMin" type="number" min="0">
  <label for="fExp">유통기한</label><input id="fExp" type="date">
  <button class="cta" id="dSave" type="button">저장</button>
  <div class="drow"><button class="tbtn" id="dDel" type="button">삭제</button><button class="tbtn" id="dBuy" type="button">구매 완료</button><button class="tbtn" id="dCancel" type="button">닫기</button></div>
</dialog>

<script>

function mkPantry(x,z,ry,c,wf=1){
 const w=v=>v*wf,G=new THREE.Group();G.position.set(x,0,z);G.rotation.y=ry;sc.add(G);
 put(G,rb(w(3.4),3.4,1.6,.1,c[0]),0,1.7,0);put(G,rb(w(3.6),.16,1.8,.06,c[1]),0,3.48,0);put(G,rb(w(3.1),1.55,.1,.05,"#fff3d6"),0,2.55,.84);

 const L=new THREE.Group(),Rg=new THREE.Group();L.position.set(w(-1.7),2.55,.9);Rg.position.set(w(1.7),2.55,.9);G.add(L,Rg);
 put(L,rb(w(1.65),1.55,.16,.06,"#fff3d6"),w(.83),0,0);put(L,sph(.07,c[3]),w(1.5),0,.12);put(Rg,rb(w(1.65),1.55,.16,.06,"#fff3d6"),w(-.83),0,0);put(Rg,sph(.07,c[3]),w(-1.5),0,.12);
 const DR=[1.15,.4].map(y=>{const d=new THREE.Group();d.position.set(0,y,.9);G.add(d);put(d,rb(w(3.1),.72,.2,.06,c[2]),0,0,0);put(d,sph(.09,c[4]),0,0,.14);return d});
 return{G,L,Rg,DR}}

function frond(phi,L,sp,k){
 const rx=Math.cos(phi),rz=Math.sin(phi),n0=vec(-rz,0,rx);
 const pt=t=>vec(rx*(.1+L*sp*t),2.02+L*(1.5*t-k*t*t),rz*(.1+L*sp*t)),tg=t=>vec(rx*L*sp,L*(1.5-2*k*t),rz*L*sp).normalize();
 T.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([0,.2,.4,.6,.8,1].map(pt)),14,.013,5),STM));
 const N=6;
 for(let j=0;j<N;j++){
  const t=.2+.75*j/(N-1),p=pt(t),tt=tg(t),up=n0.clone().cross(tt).normalize(),ln=L*(.3-.21*j/(N-1));
  [-1,1].forEach(sd=>{
   const X=n0.clone().multiplyScalar(sd).add(tt.clone().multiplyScalar(.5)).normalize();
   const Y=up.clone().sub(X.clone().multiplyScalar(up.dot(X))).normalize(),Z=new THREE.Vector3().crossVectors(X,Y);
   const q=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(X,Y,Z));
   [[.3,.3,1],[.68,.3,.82],[1.05,.24,.6]].forEach(([d,a,w],m)=>{
    const lm=new THREE.Mesh(FG,FMt[(j+m)%3]);lm.position.copy(p).add(X.clone().multiplyScalar(ln*d));lm.quaternion.copy(q);lm.scale.set(ln*a,.02,ln*.36*w);T.add(lm)})})}
 const tip=new THREE.Mesh(FG,FMt[0]);tip.position.copy(pt(1.02));tip.scale.set(.05,.02,.035);T.add(tip)}
[[.2,.92,.78,1],[1.1,.83,.72,1],[2,.99,.8,1.05],[2.9,.8,.7,.95],[3.8,.94,.78,1],[4.6,.85,.74,1],[5.5,.97,.8,1.05],[.9,.71,.35,.6],[3.3,.76,.3,.55],[5.2,.67,.32,.6]].forEach(a=>frond(...a));
/* 털 달린 뿌리줄기(토끼발) */

 const rx=Math.cos(phi),rz=Math.sin(phi);
